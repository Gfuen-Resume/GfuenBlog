name: Deploy to Resume S3 Bucket

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write 
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::612068038704:role/GitHubAction-AssumeRoleWithAction
          aws-region: us-east-1

      - name: Sync to S3
        run: aws s3 sync ./ s3://gregoryfuentescloud-fwtx.com --delete
